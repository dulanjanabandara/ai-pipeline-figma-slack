display_information:
  name: AI Pipeline Bot
  description: Design → Code → Deploy control plane
  background_color: "#1a2332"
features:
  bot_user:
    display_name: AI Pipeline
    always_online: true
  slash_commands:
    - command: /ship-design
      description: Start Figma → React → GitHub → Linear → Railway pipeline
      usage_hint: "[figma-url] [owner/repo] [--live] [--approve]"
      should_escape: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
      - channels:history
      - channels:read
      - im:history
      - im:read
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
